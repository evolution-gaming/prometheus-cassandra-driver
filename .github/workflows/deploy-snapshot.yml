name: Deploy Snapshot

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: verify
        run: mvn verify -B -Dgpg.skip

  deploy-snapshot:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5

      - name: Decode PGP secrets
        run: |
          PGP_KEY=$(echo "${{ secrets.PGP_SECRET }}" | base64 -d)
          PGP_PASS=$(echo "${{ secrets.PGP_PASSPHRASE }}" | base64 -d)
          {
            echo "PGP_KEY_DECODED<<EOF"
            echo "$PGP_KEY"
            echo "EOF"
          } >> $GITHUB_ENV
          {
            echo "PGP_PASS_DECODED<<EOF"
            echo "$PGP_PASS"
            echo "EOF"
          } >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ env.PGP_KEY_DECODED }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set SNAPSHOT version
        run: mvn versions:set -DnewVersion=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')-$(date +%Y%m%d)-$(git rev-parse --short HEAD)-SNAPSHOT

      - name: Publish SNAPSHOT to Maven Central
        run: mvn -B deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ env.PGP_PASS_DECODED }}
